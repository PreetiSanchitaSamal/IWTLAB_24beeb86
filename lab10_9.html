<html>
<head>
<script>
function isArmstrong(num){
  var str = num.toString();
  var power = str.length;
  var sum = 0;
  for(var i=0;i<str.length;i++){
    sum += Math.pow(parseInt(str[i]), power);
  }
  return sum===num;
}
let n=parseInt(prompt("enter a number"));
document.write(n + " is Armstrong? " + isArmstrong(n));
</script>
</head>
<body bgcolor="pink" text="black"></body>
</html>

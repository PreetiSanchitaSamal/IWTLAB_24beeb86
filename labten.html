<html>
    <head>
        <style>
            body{
                font-family:arial;
                background-color:rgb(243, 240, 240);
                display: flex;
                justify-content:center;
                align-items:center;
                height:100vh;
            }
            .card{
                background:white;
                width:300px;
                align-items: center;
                padding:20px;
                border-radius:10px;
                box-shadow: 0 4 8px rgb(171, 170, 170);
                text-align:center;
            }
            #photo{
                width:120px;
                height: 120px;
                border:5px solid blue;
                border-radius:50%;
                margin-bottom:15px;
            }
            p{
                color:gray;
                font-size:15px;
            }
        </style>
    </head>
    <body>
        <div class="card" align="center">
            <img id="photo" src="pexels-pixabay-207049.jpg">
            <h2>John Doe</h2>
            <p>A passionate web developer who loves building interactive websites.<br>
            john.doe@example.com<br>+91-1234567890</p>
        </div>
    </body>
</html>

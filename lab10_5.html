<head>
<script>
var a=new Array(10,20,30,40);
var max=a[0];
var semax=a[2];
for(let i=0;i<a.lenth;i++)
{
if(a[i]>max)
{
max=a[i];
semax=max;
}
if(a[i]>semax && a[i]!==max)
{
semax=a[i];
}
}
document.write("the second largest="+semax);
</script>
